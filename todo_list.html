<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Full-Featured Browser Todo List</title>
  <style>
    :root {
  --bg-color: #f4f4f9;
  --card-bg: #ffffff;
  --text-color: #222222;
  --muted-text: #666666;
  --border-color: #dddddd;
  --input-bg: #ffffff;
  --filter-bg: #e9ecef;
  --primary: #007bff;
}

body.dark {
  --bg-color: #121212;
  --card-bg: #1e1e24;
  --text-color: #f1f1f1;
  --muted-text: #a0a0ab;
  --border-color: #33333d;
  --input-bg: #2a2a32;
  --filter-bg: #2f2f38;
}

* {
  box-sizing: border-box;
  font-family: system-ui, -apple-system, sans-serif;
}

body {
  background-color: var(--bg-color);
  color: var(--text-color);
  display: flex;
  justify-content: center;
  padding: 40px 15px;
  margin: 0;
  transition: background-color 0.2s, color 0.2s;
}

.container {
  background: var(--card-bg);
  padding: 24px;
  border-radius: 10px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
  width: 100%;
  max-width: 540px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
}

h1 {
  margin: 0;
  font-size: 1.5rem;
}

.theme-btn {
  background: var(--filter-bg);
  color: var(--text-color);
  border: 1px solid var(--border-color);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 0.85rem;
}

form {
  display: grid;
  grid-template-columns: 1fr auto auto auto;
  gap: 8px;
  margin-bottom: 16px;
}

@media (max-width: 520px) {
  form {
    grid-template-columns: 1fr 1fr;
  }
  form input[type="text"],
  form button {
    grid-column: 1 / -1;
  }
}

input,
select {
  padding: 8px 10px;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  background: var(--input-bg);
  color: var(--text-color);
  font-size: 0.9rem;
}

button {
  padding: 8px 14px;
  border: none;
  background-color: var(--primary);
  color: white;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
}

button:hover {
  opacity: 0.9;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
}

.filters {
  display: flex;
  gap: 6px;
}

.filter-btn {
  background-color: var(--filter-bg);
  color: var(--text-color);
  font-size: 0.82rem;
  padding: 5px 10px;
}

.filter-btn.active {
  background-color: var(--primary);
  color: #fff;
}

.search-input {
  padding: 5px 10px;
  font-size: 0.85rem;
  width: 170px;
}

ul {
  list-style: none;
  padding: 0;
  margin: 0;
}

li {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 12px 8px;
  border-bottom: 1px solid var(--border-color);
}

.task-left {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  flex: 1;
}

.task-left input[type="checkbox"] {
  margin-top: 4px;
  cursor: pointer;
}

.task-details {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.task-text {
  font-size: 0.98rem;
  word-break: break-word;
}

li.completed .task-text {
  text-decoration: line-through;
  color: var(--muted-text);
}

.meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.75rem;
  color: var(--muted-text);
}

.badge {
  padding: 2px 7px;
  border-radius: 12px;
  font-weight: 600;
  text-transform: uppercase;
  font-size: 0.68rem;
}

.priority-high {
  background-color: #ffe3e6;
  color: #c92a2a;
}

.priority-medium {
  background-color: #fff3bf;
  color: #d9480f;
}

.priority-low {
  background-color: #d3f9d8;
  color: #2b8a3e;
}

.inline-edit-input {
  width: 100%;
  padding: 4px 8px;
  font-size: 0.95rem;
}

.actions {
  display: flex;
  gap: 5px;
}

.edit-btn {
  background-color: #ffc107;
  color: #000;
  padding: 4px 8px;
  font-size: 12px;
}

.save-btn {
  background-color: #28a745;
  color: #fff;
  padding: 4px 8px;
  font-size: 12px;
}

.delete-btn {
  background-color: #dc3545;
  padding: 4px 8px;
  font-size: 12px;
}

.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
  font-size: 0.85rem;
  color: var(--muted-text);
}

.clear-btn {
  background: transparent;
  color: #dc3545;
  padding: 4px 6px;
  font-size: 0.85rem;
}

.clear-btn:hover {
  text-decoration: underline;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Todo List</h1>
      <button id="theme-toggle" class="theme-btn">Dark Mode</button>
    </div>

    <form id="todo-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" required />
      <select id="priority-select" title="Priority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="due-date-input" title="Due Date" />
      <button type="submit">Add</button>
    </form>

    <div class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <input type="text" id="search-input" class="search-input" placeholder="Search tasks..." />
    </div>

    <ul id="todo-list"></ul>

    <div class="footer">
      <span id="items-left">0 items left</span>
      <button id="clear-completed" class="clear-btn">Clear Completed</button>
    </div>
  </div>

  <script>
    const todoForm = document.getElementById('todo-form');
const todoInput = document.getElementById('todo-input');
const prioritySelect = document.getElementById('priority-select');
const dueDateInput = document.getElementById('due-date-input');
const todoList = document.getElementById('todo-list');
const filterBtns = document.querySelectorAll('.filter-btn');
const searchInput = document.getElementById('search-input');
const itemsLeftSpan = document.getElementById('items-left');
const clearCompletedBtn = document.getElementById('clear-completed');
const themeToggle = document.getElementById('theme-toggle');

let todos = JSON.parse(localStorage.getItem('todos')) || [];
let currentFilter = 'all';
let searchQuery = '';
let editingId = null;

// Load saved theme
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  themeToggle.textContent = 'Light Mode';
}

themeToggle.addEventListener('click', () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  themeToggle.textContent = isDark ? 'Light Mode' : 'Dark Mode';
});

function saveTodos() {
  localStorage.setItem('todos', JSON.stringify(todos));
}

function updateCounter() {
  const activeCount = todos.filter((t) => !t.completed).length;
  itemsLeftSpan.textContent = `${activeCount} item${activeCount === 1 ? '' : 's'} left`;
}

function renderTodos() {
  todoList.innerHTML = '';

  const filteredTodos = todos.filter((todo) => {
    const matchesFilter =
      currentFilter === 'all' ||
      (currentFilter === 'active' && !todo.completed) ||
      (currentFilter === 'completed' && todo.completed);

    const matchesSearch = todo.text
      .toLowerCase()
      .includes(searchQuery.toLowerCase());

    return matchesFilter && matchesSearch;
  });

  filteredTodos.forEach((todo) => {
    const li = document.createElement('li');
    if (todo.completed) li.classList.add('completed');

    // Left side: Checkbox + Details
    const taskLeft = document.createElement('div');
    taskLeft.classList.add('task-left');

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = todo.completed;
    checkbox.addEventListener('change', () => {
      todo.completed = checkbox.checked;
      saveTodos();
      renderTodos();
    });

    const taskDetails = document.createElement('div');
    taskDetails.classList.add('task-details');

    // Inline Edit Mode vs Display Mode
    if (editingId === todo.id) {
      const editInput = document.createElement('input');
      editInput.type = 'text';
      editInput.value = todo.text;
      editInput.classList.add('inline-edit-input');

      editInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          saveInlineEdit(todo.id, editInput.value);
        } else if (e.key === 'Escape') {
          editingId = null;
          renderTodos();
        }
      });

      taskDetails.appendChild(editInput);
      setTimeout(() => editInput.focus(), 0);
    } else {
      const span = document.createElement('span');
      span.textContent = todo.text;
      span.classList.add('task-text');
      taskDetails.appendChild(span);
    }

    // Priority & Due Date Metadata
    const meta = document.createElement('div');
    meta.classList.add('meta');

    const badge = document.createElement('span');
    badge.textContent = todo.priority;
    badge.classList.add('badge', `priority-${todo.priority}`);
    meta.appendChild(badge);

    if (todo.dueDate) {
      const dateSpan = document.createElement('span');
      dateSpan.textContent = `Due: ${todo.dueDate}`;
      meta.appendChild(dateSpan);
    }

    taskDetails.appendChild(meta);
    taskLeft.appendChild(checkbox);
    taskLeft.appendChild(taskDetails);

    // Right side: Edit/Save + Delete buttons
    const actions = document.createElement('div');
    actions.classList.add('actions');

    if (editingId === todo.id) {
      const saveBtn = document.createElement('button');
      saveBtn.textContent = 'Save';
      saveBtn.classList.add('save-btn');
      saveBtn.addEventListener('click', () => {
        const inputEl = li.querySelector('.inline-edit-input');
        saveInlineEdit(todo.id, inputEl.value);
      });
      actions.appendChild(saveBtn);
    } else {
      const editBtn = document.createElement('button');
      editBtn.textContent = 'Edit';
      editBtn.classList.add('edit-btn');
      editBtn.addEventListener('click', () => {
        editingId = todo.id;
        renderTodos();
      });
      actions.appendChild(editBtn);
    }

    const deleteBtn = document.createElement('button');
    deleteBtn.textContent = 'Delete';
    deleteBtn.classList.add('delete-btn');
    deleteBtn.addEventListener('click', () => {
      todos = todos.filter((t) => t.id !== todo.id);
      saveTodos();
      renderTodos();
    });

    actions.appendChild(deleteBtn);

    li.appendChild(taskLeft);
    li.appendChild(actions);
    todoList.appendChild(li);
  });

  updateCounter();
}

function saveInlineEdit(id, newText) {
  const trimmed = newText.trim();
  if (trimmed) {
    const target = todos.find((t) => t.id === id);
    if (target) target.text = trimmed;
    saveTodos();
  }
  editingId = null;
  renderTodos();
}

// Add new task
todoForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const text = todoInput.value.trim();
  if (!text) return;

  todos.push({
    id: Date.now(),
    text,
    priority: prioritySelect.value,
    dueDate: dueDateInput.value,
    completed: false,
  });

  saveTodos();
  renderTodos();
  todoInput.value = '';
  dueDateInput.value = '';
});

// Filter tabs
filterBtns.forEach((btn) => {
  btn.addEventListener('click', () => {
    filterBtns.forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderTodos();
  });
});

// Live search
searchInput.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  renderTodos();
});

// Clear completed
clearCompletedBtn.addEventListener('click', () => {
  todos = todos.filter((t) => !t.completed);
  saveTodos();
  renderTodos();
});

renderTodos();
  </script>
</body>
</html>
